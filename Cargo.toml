[package]
name = "rest_tensors"
version = "0.1.1"
edition = "2021"
authors = ["Igor Ying Zhang <igor_zhangying@fudan.edu.cn>"]
description = "Provide efficient tensor operations for the Rust-based Electronic Structure Tool (REST)"
license = "MIT OR Apache-2.0"

#build = "build.rs"
[build-dependencies]
dunce = "1.0.0"

[lib]
bench = true
crate-type = ["dylib", "rlib"]
#crate-type = ["lib"]

[dev-dependencies]
criterion = "0.4"

[[bench]]
name = "bench_tensors"
harness = false


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#lapack-sys = "0.15"
#blas-sys = "0.9"
lapack = "0.20"
blas = "0.23"
num-complex = "0.4"
libc = "0.2"
typenum = "1.14"
rayon = "1.5.1"
itertools = "0.10.3"
anyhow = "1"
nalgebra = "0.31.1"
regex = "0.1.41"
rand = "0.8.5"
num-traits = "0.2.15"
mpi = { version = "0.8", optional = true }

[features]
default = ["mpi"]
intel-mkl = []
openblas = []
# Selects the threading backend of the BLAS thread-count wrapper:
# - off (default): OpenMP-built OpenBLAS -> `omp_set_num_threads` (per-thread ICV,
#   the only correct semantics when called from rayon workers);
# - on: pthread-built OpenBLAS -> `openblas_set_num_threads` (atomic global; the
#   OpenMP API would be a no-op on a pthread build, and the OpenBLAS API is not
#   thread-safe on an OpenMP build).
openblas-pthread = []
mpi = ["dep:mpi"]
scalapack = ["mpi"]
pexsi     = ["mpi"]

